name: Update CodePet stats

on:
  schedule:
    - cron: "0 20 * * *" # minden nap 20:00 UTC = 22:00 CEST
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats and write data.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          python3 - <<'EOF'
          import datetime
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          user = os.environ["GH_USER"]
          token = os.environ["GH_TOKEN"]
          pat = os.environ.get("GH_PAT")
          if not pat:
              raise SystemExit(
                  "GH_PAT secret is not set. The default GITHUB_TOKEN cannot enumerate "
                  "the owner's other repositories via /user/repos, so the resulting "
                  "data.json would silently contain only the current repo's commits. "
                  "Create a classic PAT with the 'repo' scope (or a fine-grained PAT "
                  "with Contents: Read on all repos) and add it as a GH_PAT secret."
              )
          days = 30

          def gh(url, use_pat=False):
              auth_token = pat if use_pat else token
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {auth_token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read())

          def list_repos():
              repos = []
              page = 1
              while True:
                  batch = gh(
                      f"https://api.github.com/user/repos?per_page=100&page={page}&affiliation=owner",
                      use_pat=True,
                  )
                  if not batch:
                      break
                  repos.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1
              return repos

          def list_commits(repo_name, since_iso):
              commits = []
              page = 1
              while True:
                  query = urllib.parse.urlencode(
                      {
                          "author": user,
                          "since": since_iso,
                          "per_page": 100,
                          "page": page,
                      }
                  )
                  url = f"https://api.github.com/repos/{repo_name}/commits?{query}"
                  try:
                      batch = gh(url, use_pat=True)
                  except urllib.error.HTTPError as err:
                      # 409 Conflict: empty repo, nincs commit-történet.
                      if err.code == 409:
                          return commits
                      raise
                  if not batch:
                      break
                  commits.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1
              return commits

          since = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=days)
          since_iso = since.isoformat().replace("+00:00", "Z")

          all_repos = list_repos()

          total_commits = 0
          active_repos = set()
          day_set = set()
          lang_counts = {}

          for repo in all_repos:
              repo_name = repo["full_name"]
              lang = repo.get("language")
              if lang:
                  lang_counts[lang] = lang_counts.get(lang, 0) + 1

              commits = list_commits(repo_name, since_iso)
              if commits:
                  total_commits += len(commits)
                  active_repos.add(repo_name)
                  for commit in commits:
                      date = commit.get("commit", {}).get("author", {}).get("date", "")
                      if date:
                          day_set.add(date[:10])

          streak = 0
          day = datetime.datetime.now(datetime.timezone.utc).date()
          for _ in range(365):
              if day.isoformat() in day_set:
                  streak += 1
                  day -= datetime.timedelta(days=1)
              else:
                  break

          top_lang = max(lang_counts, key=lang_counts.get) if lang_counts else "?"

          data = {
              "updated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "user": user,
              "window_days": days,
              "commits": total_commits,
              "streak": streak,
              "repos": len(active_repos),
              "top_lang": top_lang,
          }

          with open("data.json", "w", encoding="utf-8") as out:
              json.dump(data, out, indent=2)

          print(json.dumps(data, indent=2))
          EOF

      - name: Commit data.json
        run: |
          git config user.name "codepet-bot"
          git config user.email "codepet-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "chore: update codepet stats"
          git push
