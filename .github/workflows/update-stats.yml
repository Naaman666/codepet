name: Update CodePet stats

on:
  schedule:
    - cron: "0 20 * * *"   # minden nap 20:00 UTC = 22:00 CEST
  workflow_dispatch:        # kézi indításhoz is

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats and write data.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT:   ${{ secrets.GH_PAT }}
          GH_USER:  ${{ github.repository_owner }}
        run: |
          python3 - <<'EOF'
          import urllib.request, json, os, datetime

          user  = os.environ["GH_USER"]
          pat   = os.environ["GH_PAT"]
          token = os.environ["GH_TOKEN"]
          days  = 30

          def gh(url, use_pat=False):
              t = pat if use_pat else token
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {t}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          since = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=days)
          since_iso = since.isoformat().replace("+00:00", "Z")

          # --- összes repó (publikus + privát) ---
          all_repos = []
          page = 1
          while True:
              batch = gh(f"https://api.github.com/user/repos?per_page=100&page={page}&affiliation=owner", use_pat=True)
              if not batch:
                  break
              all_repos.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          # --- commitok számlálása repónként ---
          total_commits = 0
          active_repos  = set()
          day_set       = set()
          lang_counts   = {}

          for repo in all_repos:
              repo_name = repo["full_name"]
              lang = repo.get("language")
              if lang:
                  lang_counts[lang] = lang_counts.get(lang, 0) + 1
              try:
                  commits = gh(
                      f"https://api.github.com/repos/{repo_name}/commits"
                      f"?author={user}&since={since_iso}&per_page=100",
                      use_pat=True
                  )
                  if commits:
                      total_commits += len(commits)
                      active_repos.add(repo_name)
                      for c in commits:
                          date = c.get("commit", {}).get("author", {}).get("date", "")
                          if date:
                              day_set.add(date[:10])
              except Exception:
                  pass

          # --- streak ---
          streak, d = 0, datetime.date.today()
          for _ in range(365):
              if d.isoformat() in day_set:
                  streak += 1
                  d -= datetime.timedelta(days=1)
              else:
                  break

          top_lang = max(lang_counts, key=lang_counts.get) if lang_counts else "?"

          data = {
              "updated_at":  datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "user":        user,
              "window_days": days,
              "commits":     total_commits,
              "streak":      streak,
              "repos":       len(active_repos),
              "top_lang":    top_lang,
          }

          with open("data.json", "w") as f:
              json.dump(data, f, indent=2)

          print(json.dumps(data, indent=2))
          EOF

      - name: Commit data.json
        run: |
          git config user.name  "codepet-bot"
          git config user.email "codepet-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "chore: update codepet stats [skip ci]"
          git push
